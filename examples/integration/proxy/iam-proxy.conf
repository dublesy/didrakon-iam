# Apache httpd + mod_auth_openidc 를 C++ 앱(127.0.0.1:9000) 앞에 둔다.
# ${...} 는 컨테이너 시작 때의 환경변수 (docker-entrypoint.sh). 비밀값은 이 파일에 두지 않는다.
Listen 4110
ServerName localhost

# ---- IAM 연결 ----
OIDCProviderMetadataURL ${IAM_ISSUER}/.well-known/openid-configuration
OIDCClientID ${CLIENT_ID}
OIDCClientSecret ${CLIENT_SECRET}
OIDCProviderTokenEndpointAuth client_secret_basic
# 계약의 /callback. 로그인 응답과 back-channel 로그아웃(/callback?logout=backchannel)을 모듈이 직접 받는다
OIDCRedirectURI ${APP_BASE_URL}/callback
OIDCScope "openid profile"
# state·nonce 는 모듈이 늘 쓴다. PKCE 는 켜야 한다
OIDCPKCEMethod S256
# ID 토큰 서명 알고리즘을 고정한다 (client secret 으로 만든 HS256 토큰을 받지 않게)
OIDCIDTokenSignedResponseAlg RS256
# 세션 쿠키·state 쿠키 암호화 키. 컨테이너가 뜰 때마다 새로 만든다 (재시작하면 로그인이 풀린다)
OIDCCryptoPassphrase ${OIDC_CRYPTO_PASSPHRASE}

# ---- 세션 ----
# 세션은 서버 캐시(공유 메모리)에 두고 쿠키에는 ID 만 둔다. back-channel 로그아웃이 이 캐시에서 세션을 지운다.
# 서버가 여러 대면 OIDCCacheType redis 로 바꾼다
OIDCSessionType server-cache
OIDCCacheType shm
OIDCCookieSameSite On
OIDCSessionInactivityTimeout 3600

# ---- 앱에 넘기는 값 ----
# ID 토큰 claim 을 OIDC_CLAIM_<이름> 헤더로 넘긴다 (OIDC_CLAIM_sub, OIDC_CLAIM_emp_no, OIDC_CLAIM_roles=a,b ...).
# 요청에 같은 이름의 헤더가 들어 오면 모듈이 지운다 (OIDCScrubRequestHeaders 기본 On) — 보호한 경로에서만
OIDCPassClaimsAs headers none
OIDCPassIDTokenAs claims
OIDCPassUserInfoAs claims

<VirtualHost *:4110>
    ProxyPreserveHost On
    ProxyPass        /callback !
    ProxyPass        /logout !
    ProxyPass        / http://127.0.0.1:9000/
    ProxyPassReverse / http://127.0.0.1:9000/

    # 기본은 모두 로그인 필요. /login 으로 오면 IAM 으로 보내고, 로그인 뒤 앱의 /login 이 /me 로 보낸다
    <Location />
        AuthType openid-connect
        Require valid-user
    </Location>

    # /me 는 로그인하지 않았으면 IAM 으로 보내지 않고 401 (API 처럼 쓰는 주소)
    <Location /me>
        OIDCUnAuthAction 401
        ErrorDocument 401 "{\"error\":\"unauthorized\"}"
        Header always set Content-Type "application/json; charset=utf-8" "expr=%{REQUEST_STATUS} == 401"
    </Location>

    # 웹훅은 서버 간 호출. OIDC 로그인 없이 받고, 앱이 HMAC 서명으로 확인한다
    <Location /webhooks/iam>
        AuthType None
        Require all granted
    </Location>

    # 앱 세션(프록시 세션)을 지우고 IAM /connect/logout?id_token_hint=... 로 보낸다.
    # 돌아올 주소(post_logout_redirect_uri)는 IAM 클라이언트에 등록해야 한다
    RedirectMatch 302 ^/logout$ ${APP_BASE_URL}/callback?logout=${APP_BASE_URL}/me

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
