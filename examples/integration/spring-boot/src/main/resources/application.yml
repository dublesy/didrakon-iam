server:
  port: 4101

spring:
  security:
    oauth2:
      client:
        registration:
          iam:
            client-id: ${IAM_CLIENT_ID:sample-spring-boot}
            client-secret: ${IAM_CLIENT_SECRET:dummy-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/callback"
            scope: openid,profile
        provider:
          iam:
            # 시작할 때 {issuer}/.well-known/openid-configuration 을 읽는다 (IAM 이 떠 있어야 한다)
            issuer-uri: ${IAM_ISSUER:http://localhost:8080}

# 웹훅 서명 비밀값. 없으면 시작하지 않는다
webhook:
  secret: ${WEBHOOK_SECRET}
