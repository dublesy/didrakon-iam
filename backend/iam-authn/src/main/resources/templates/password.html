<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('비밀번호 변경')}"></head>
<body>
<div th:replace="~{fragments :: brand}"></div>
<main class="card">
  <h1>비밀번호 변경</h1>
  <p class="lead">
    <span th:text="${loginId}">user</span> 계정은 비밀번호를 바꿔야 로그인할 수 있습니다
  </p>

  <p th:if="${error}" class="message error" role="alert" th:text="${error}">오류</p>

  <form method="post" th:action="@{/login/password}">
    <label>새 비밀번호
      <input name="newPassword" type="password" autocomplete="new-password" minlength="10" required autofocus>
    </label>
    <label>새 비밀번호 확인
      <input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
    </label>
    <p class="hint">10자 이상, 로그인 ID 를 넣을 수 없습니다</p>
    <button type="submit">바꾸기</button>
  </form>
</main>
<p th:replace="~{fragments :: footer}"></p>
</body>
</html>
