spring:
  application:
    name: didrakon-iam
  profiles:
    default: local
  datasource:
    hikari:
      # URL 이 아닌 드라이버 속성으로 두어 Testcontainers 연결에도 똑같이 적용된다
      data-source-properties:
        connectionTimeZone: Asia/Seoul
        forceConnectionTimeZoneToSession: true # 서버·JVM 시간대와 무관하게 세션을 KST 로 고정
        preserveInstants: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 로만 관리
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100 # N+1 안전망
  # 브라우저(HTTP) 세션은 DB 에 둔다 (Spring Session JDBC). 재기동·배포에도 IdP 로그인이 유지되고 여러 인스턴스가 함께 쓴다.
  # 테이블은 Flyway(V22)가 만든다. 세션 쿠키(이름·HttpOnly·SameSite)는 config/HttpSessionConfig 에서 정한다
  session:
    # 마지막 요청 뒤 이만큼 쓰지 않으면 끝난다 (이전 Tomcat 세션 기본값과 같다).
    # 로그인 세션의 절대 만료(iam.authn.session-timeout, 8시간)는 LoginSessionValidationFilter 가 따로 지킨다
    timeout: 30m
    jdbc:
      initialize-schema: never

iam:
  authn:
    issuer: ${IAM_ISSUER:http://localhost:8080}
    # 관리 콘솔 주소. IAM 홈의 바로가기(내 정보·2단계 인증·관리 콘솔)에 쓴다
    console-url: ${IAM_CONSOLE_URL:http://localhost:3000}
    # MFA 비밀값 암호화 키. 비어 있으면 기동하지 않는다 (생성: openssl rand -base64 32)
    secret-key: ${IAM_SECRET_KEY:}
    # JWT 서명 키(PEM). 비어 있으면 기동할 때 만들어 재기동 시 기존 토큰이 무효가 된다
    jwt-private-key: ${IAM_JWT_PRIVATE_KEY:}
    jwt-public-key: ${IAM_JWT_PUBLIC_KEY:}
  bootstrap:
    admin-console-redirect-uris: ${IAM_ADMIN_CONSOLE_REDIRECT_URIS:http://localhost:3000/callback}
    admin-console-post-logout-redirect-uris: ${IAM_ADMIN_CONSOLE_POST_LOGOUT_URIS:http://localhost:3000/}
    # 최초 관리자. 둘 다 넣으면 기동 시 한 번 만든다
    admin-login-id: ${IAM_BOOTSTRAP_ADMIN_LOGIN:}
    admin-password: ${IAM_BOOTSTRAP_ADMIN_PASSWORD:}
  risk:
    # 로그인 위험 조치가 CHALLENGE·APPROVAL 인데 확인된 MFA 가 없으면 막는다 (/login?challenge). false 면 기록만 하고 들여보낸다
    block-challenge-without-mfa: true
    # 해외 IP 신호(FOREIGN_IP)용 MaxMind GeoLite2/GeoIP2 Country 파일(.mmdb). 경로를 넣었는데 파일이 없으면 기동하지 않는다
    geoip-database: ${IAM_GEOIP_DATABASE:}
    # CIDR → 국가 코드. DB 보다 먼저 보며 DB 없이 이것만 써도 된다. DB·대역 모두 없으면 FOREIGN_IP 는 잡히지 않는다
    # ip-country-overrides:
    #   "[10.0.0.0/8]": KR
