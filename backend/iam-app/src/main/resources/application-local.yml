# 접속 정보는 환경변수로 주입한다 (값은 루트의 .env.example 참고)
# localhost 는 포트가 달라도 쿠키를 함께 쓴다. 콘솔(:3000)의 로그인 쿠키와 다른 로컬 프로젝트 쿠키까지 IAM(:8080)으로 가서
# 기본 한도(8KB)를 넘으면 "Request header is too large" 로 인가 요청이 실패한다. 운영은 도메인이 달라 해당 없다
server:
  max-http-request-header-size: 32KB

spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:iam}?characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

iam:
  # 화면 확인용 예시 데이터 (config/LocalDemoData). 한 번만 만든다
  demo-data:
    enabled: true
  # 로컬에서는 localhost 수신처로 웹훅을 시험할 수 있게 내부망 주소를 허용한다 (운영 기본값은 차단)
  webhook:
    allow-private-network: true
